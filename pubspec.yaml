name: powernet_staff
description: "PowerNet Staff mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.1.0
  go_router: ^14.0.0
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^6.0.0
  google_fonts: ^6.0.0
  image_picker: ^1.1.2
  http: ^1.2.2
  url_launcher: ^6.3.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon/powernet_app_icon_dashboard_gradient.png"

flutter:
  uses-material-design: true
  assets:
    - assets/.env
